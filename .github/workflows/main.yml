name: Generate Snake
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

# Ini adalah kunci untuk mengatasi error 128
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: RajwaNuwayyar
          outputs: |
            dist/github-contribution-grid-snake.svg
      
      # Versi diperbarui ke v4 untuk mengatasi warning Node.js
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
